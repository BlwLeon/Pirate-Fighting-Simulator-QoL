name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Create a release with this tag (e.g. v1.0.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install pyinstaller -r launcher/requirements.txt

      - name: Generate icon
        run: python -c "import sys; sys.path.insert(0, 'launcher'); import theme; theme.icon(256).save('launcher/icon.ico', sizes=[(256,256),(64,64),(48,48),(32,32),(16,16)])"

      - name: Build launcher exe
        working-directory: launcher
        run: pyinstaller --noconfirm --onefile --windowed --name PFS-QoL-Launcher --icon icon.ico --add-data "../mod/PFS_QoL;PFS_QoL" pfs_qol_launcher.py

      - name: Package mod for manual install
        shell: pwsh
        run: Compress-Archive -Path mod/PFS_QoL -DestinationPath PFS_QoL-mod.zip

      - name: Launcher screenshots
        continue-on-error: true
        working-directory: launcher
        run: |
          python pfs_qol_launcher.py --screenshot ../shot-main.png
          python pfs_qol_launcher.py --screenshot ../shot-options.png --screen options

      - name: Publish screenshots to branch ci-screenshots (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        continue-on-error: true
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rf --cached . | Out-Null
          git add -f shot-main.png shot-options.png
          git commit -m "Launcher screenshots from CI"
          git push -f origin ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            launcher/dist/PFS-QoL-Launcher.exe
            PFS_QoL-mod.zip
            shot-*.png

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: PFS QoL ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: |
            launcher/dist/PFS-QoL-Launcher.exe
            PFS_QoL-mod.zip

      - name: Remove CI screenshot branch
        if: inputs.tag != ''
        continue-on-error: true
        shell: pwsh
        run: git push origin --delete ci-screenshots
